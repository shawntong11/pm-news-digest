name: 每日金融简报

on:
  # 定时生成已经搬到云服务器 162.243.30.99（server/run.sh + cron），这里只保留手动运行
  workflow_dispatch:
    inputs:
      force:
        description: 不管时段，立刻生成一版
        type: boolean
        default: false

concurrency:
  group: news-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 判断这次要不要生成
        id: check
        run: python digest.py --check ${{ inputs.force && '--force' || '' }} >> "$GITHUB_OUTPUT"

      - name: 同步事件日历
        if: steps.check.outputs.run == 'true'
        run: python events/sync_events.py || echo "日历同步失败，继续生成摘要"

      - name: 生成摘要
        if: steps.check.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CALENDAR_DB: events/calendar.db
        run: python digest.py --force

      - name: 保存结果到仓库
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data events/calendar.db
          git diff --cached --quiet && exit 0
          git commit -q -m "摘要 $(TZ=America/New_York date '+%m-%d %H:%M') ET"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

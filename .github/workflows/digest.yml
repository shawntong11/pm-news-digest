name: 每日金融简报

on:
  schedule:
    # GitHub 用 UTC。覆盖美东 8:00 到次日 1:00（夏令时和冬令时都覆盖）。
    # GitHub 的定时触发经常被丢掉，所以每 15 分钟触发一次（避开整点高峰）；
    # 每一版只生成一次，由 digest.py 按美东时间判断，错过的版本下一次补上。
    - cron: "7,22,37,52 0-6,12-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 不管时段，立刻生成一版
        type: boolean
        default: false

concurrency:
  group: news-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 判断这次要不要生成
        id: check
        run: python digest.py --check ${{ inputs.force && '--force' || '' }} >> "$GITHUB_OUTPUT"

      - name: 同步事件日历
        if: steps.check.outputs.run == 'true'
        run: python events/sync_events.py || echo "日历同步失败，继续生成摘要"

      - name: 生成摘要
        if: steps.check.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CALENDAR_DB: events/calendar.db
        run: python digest.py --force

      - name: 保存结果到仓库
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data events/calendar.db
          git diff --cached --quiet && exit 0
          git commit -q -m "摘要 $(TZ=America/New_York date '+%m-%d %H:%M') ET"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
